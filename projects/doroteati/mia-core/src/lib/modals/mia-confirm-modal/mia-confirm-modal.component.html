<div class="confirmation-modal">
    <h3> {{ config.title }} </h3>
    <p [innerHTML]="config.caption"></p>
    <br>
    
    <div class="buttons" style="display: flex; align-items: center;">
        @for (button of config.buttons; track button) {
            <button mat-button (click)="onClick(button.value)">{{ button.title }}</button>
        }
    </div>
</div>
